# Tests, fuzzing and proofs for the core. What each establishes, and what it
# relies on, is in docs/verification.md; `make check` runs them all locally.
# Runs on pull requests, which main requires, and on main once they merge.
name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux, JIT emulated
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libunicorn-dev llvm clang
          pip install z3-solver unicorn
      - name: Regression tests, under ASan and UBSan
        run: make test
      - name: Floating point against Unicorn's Cortex-M4
        run: make fpu
      - name: Encoder against LLVM's assembler
        run: make encodings
      - name: JIT against the interpreter
        run: make fuzz
      - name: JIT translations proved against the Thumb spec
        run: make prove

  cbmc:
    name: CBMC ${{ matrix.harness }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness: [load, restore, bus, logical_imm]
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc
      - run: make cbmc-${{ matrix.harness }}

  apple-silicon:
    name: Apple silicon, JIT native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install unicorn
      - run: swift build
      - name: Regression tests, under ASan and UBSan
        run: make test
      - name: Floating point against Unicorn's Cortex-M4
        run: make fpu
      - name: Encoder against the system assembler
        run: make encodings
      - name: JIT against the interpreter
        run: make fuzz
      - name: The proofs' translations, built here too
        run: make .build/check/jitdump && .build/check/jitdump narrow > /dev/null
